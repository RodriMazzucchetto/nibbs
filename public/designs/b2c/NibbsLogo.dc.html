<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&display=swap" rel="stylesheet">
</helmet>
<div style="display:inline-flex;align-items:center;gap:{{ gap }}px;color:{{ ink }}">
  <sc-if value="{{ showSymbol }}" hint-placeholder-val="{{ true }}">
    <div style="position:relative;width:{{ sym }}px;height:{{ sym }}px;flex:none">
      <div style="position:absolute;left:83%;top:43%;width:15%;height:15%;border-radius:50%;background:{{ ink }}"></div>
      <div style="position:absolute;left:71%;top:71%;width:15%;height:15%;border-radius:50%;background:{{ ink }}"></div>
      <div style="position:absolute;left:43%;top:83%;width:15%;height:15%;border-radius:50%;background:{{ ink }}"></div>
      <div style="position:absolute;left:15%;top:71%;width:15%;height:15%;border-radius:50%;background:{{ ink }}"></div>
      <div style="position:absolute;left:3%;top:43%;width:15%;height:15%;border-radius:50%;background:{{ ink }}"></div>
      <div style="position:absolute;left:15%;top:15%;width:15%;height:15%;border-radius:50%;background:{{ ink }}"></div>
      <div style="position:absolute;left:43%;top:3%;width:15%;height:15%;border-radius:50%;background:{{ accent }}"></div>
      <div style="position:absolute;left:71%;top:15%;width:15%;height:15%;border-radius:50%;background:{{ ink }}"></div>
    </div>
  </sc-if>
  <sc-if value="{{ showWord }}" hint-placeholder-val="{{ true }}">
    <span style="font-family:'Hedvig Letters Serif',serif;font-size:{{ fs }}px;line-height:.9;letter-spacing:-.03em;white-space:nowrap">nibbs<span style="color:{{ accent }}">.</span></span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:140},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;lockup&quot;,&quot;wordmark&quot;,&quot;symbol&quot;],&quot;default&quot;:&quot;lockup&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;tsType&quot;:&quot;number&quot;},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#261714&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B3202F&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? "lockup";
    const size = this.props.size ?? 64;
    return {
      ink: this.props.ink ?? "#261714",
      accent: this.props.accent ?? "#B3202F",
      showSymbol: v !== "wordmark",
      showWord: v !== "symbol",
      fs: size,
      sym: v === "symbol" ? size : Math.round(size * 0.82),
      gap: Math.round(size * 0.28),
    };
  }
}
</script>
</body>
</html>
